<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peminjaman — BacaPedia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="navbar" id="navbar"></div>

  <div class="page">
    <div class="page-header">
      <div>
        <h1 id="pageTitle">Peminjaman Saya</h1>
        <p id="pageSubtitle">Riwayat dan status peminjaman buku Anda</p>
      </div>
    </div>

    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <div class="filter-tabs">
      <button class="active" data-filter="semua" onclick="setFilter('semua')">Semua</button>
      <button data-filter="dipinjam" onclick="setFilter('dipinjam')">Dipinjam</button>
      <button data-filter="dikembalikan" onclick="setFilter('dikembalikan')">Dikembalikan</button>
    </div>

    <div class="card">
      <div id="loadingText" class="loading-text">Memuat data peminjaman...</div>
      <table id="loansTable" style="display:none;">
        <thead>
          <tr>
            <th>Buku</th>
            <th id="peminjamHeader" style="display:none;">Peminjam</th>
            <th>Tgl Pinjam</th>
            <th>Jatuh Tempo</th>
            <th>Tgl Kembali</th>
            <th>Status</th>
            <th>Denda</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="loansTableBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none;">Belum ada data peminjaman.</div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/loans.js"></script>
</body>
</html>
