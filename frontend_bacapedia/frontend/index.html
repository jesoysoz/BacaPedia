<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — BacaPedia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>📚 BacaPedia</h1>
      <p class="subtitle">Masuk untuk mengelola peminjaman buku</p>

      <div class="alert alert-error" id="errorAlert"></div>

      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />

        <label for="password">Kata Sandi</label>
        <input type="password" id="password" required autocomplete="current-password" />

        <button type="submit" class="btn btn-primary" id="submitBtn">Masuk</button>
      </form>

      <p class="switch-link">Belum punya akun? <a href="register.html">Daftar di sini</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
