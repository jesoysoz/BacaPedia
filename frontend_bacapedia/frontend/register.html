<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar — BacaPedia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Buat Akun</h1>
      <p class="subtitle">Daftar sebagai anggota BacaPedia</p>

      <div class="alert alert-error" id="errorAlert"></div>

      <form id="registerForm">
        <label for="name">Nama Lengkap</label>
        <input type="text" id="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />

        <label for="password">Kata Sandi</label>
        <input type="password" id="password" required autocomplete="new-password" />

        <label for="password_confirmation">Konfirmasi Kata Sandi</label>
        <input type="password" id="password_confirmation" required autocomplete="new-password" />

        <button type="submit" class="btn btn-primary" id="submitBtn">Daftar</button>
      </form>

      <p class="switch-link">Sudah punya akun? <a href="index.html">Masuk di sini</a></p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
