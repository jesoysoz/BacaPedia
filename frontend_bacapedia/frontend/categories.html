<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kategori — BacaPedia</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="navbar" id="navbar"></div>

  <div class="page">
    <div class="page-header">
      <div>
        <h1>Kategori Buku</h1>
        <p>Kelola kategori untuk pengelompokan buku</p>
      </div>
      <button class="btn btn-amber" id="addCategoryBtn">+ Tambah Kategori</button>
    </div>

    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <div class="card">
      <div id="loadingText" class="loading-text">Memuat data kategori...</div>
      <table id="categoriesTable" style="display:none;">
        <thead>
          <tr>
            <th>Nama Kategori</th>
            <th>Jumlah Buku</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="categoriesTableBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none;">Belum ada kategori.</div>
    </div>
  </div>

  <!-- Modal Tambah/Edit Kategori -->
  <div class="modal-backdrop" id="categoryModal">
    <div class="modal">
      <h2 id="categoryModalTitle">Tambah Kategori</h2>
      <div class="alert alert-error" id="categoryFormError"></div>
      <form id="categoryForm">
        <input type="hidden" id="categoryId" />

        <label for="nama_kategori">Nama Kategori</label>
        <input type="text" id="nama_kategori" required />

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeCategoryModal()">Batal</button>
          <button type="submit" class="btn btn-primary" style="width:auto;">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/categories.js"></script>
</body>
</html>
